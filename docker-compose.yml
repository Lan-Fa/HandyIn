services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-handyin}
      POSTGRES_USER: ${POSTGRES_USER:-handyin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-handyin} -d ${POSTGRES_DB:-handyin}"]
      interval: 5s
      timeout: 5s
      retries: 12

  server:
    build:
      context: .
      args:
        HANDYIN_BASE_PATH: ${HANDYIN_BASE_PATH:-/handyin}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-handyin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-handyin}
      HANDYIN_BASE_PATH: ${HANDYIN_BASE_PATH:-/handyin}
      SESSION_SECRET: ${SESSION_SECRET:?请在 .env 中设置 SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      INIT_ADMIN_USERNAME: ${INIT_ADMIN_USERNAME:-admin}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:?请在 .env 中设置 INIT_ADMIN_PASSWORD}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5}
      TZ: ${TZ:-Asia/Shanghai}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10mb}
      MAX_UPLOAD_FILES: ${MAX_UPLOAD_FILES:-1}
      WEB_DIST: /app/apps/web/dist
      APP_PORT: 3000
      HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://:80}
      HANDYIN_BASE_PATH: ${HANDYIN_BASE_PATH:-/handyin}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

volumes:
  pgdata:
  caddy_data:
  caddy_config:
